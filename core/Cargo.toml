[package]
name = "halti-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "Halti's workspace rules: plain Rust, no code for one OS, no I/O"

[dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
anyhow = "1.0"
hkdf = "0.13"
ml-kem = { version = "0.3.4", features = ["hazmat", "zeroize"] }
p256 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = { version = "0.11", features = ["zeroize"] }
zeroize = "1.9"

[dev-dependencies]
serde_json = "1.0"
