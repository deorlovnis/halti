[package]
name = "halti"
version = "0.5.1"
edition = "2024"
description = "macOS Keychain-backed secrets for humans and agents"

[dependencies]
aes = "0.9"
aho-corasick = "1.1"
anyhow = "1.0"
base64 = "0.22"
cbc = { version = "0.2", features = ["alloc"] }
chacha20poly1305 = "0.11.0"
clap = { version = "4.6", features = ["derive"] }
halti-core = { path = "core" }
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
pbkdf2 = "0.13"
percent-encoding = "2.3"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rpassword = "7.5"
rusqlite = { version = "0.41", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
similar = "2"
snap = "1"
time = "0.3"
toml = "1.1"
ureq = "3.5"
url = "2.5"
webpki-roots = "1"
zeroize = "1.9"

# Touch ID and the Keychain. Elsewhere (a box's Linux) halti builds and its tests run, but there's
# nothing to keep secrets in: see `keychain::backend` and `approve`.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"
security-framework = "3.7"

[profile.release]
lto = true
strip = true

# What check.sh builds to check a release build: the release profile without the slow link-time
# optimisation. `halti build-info` must say it has no test hooks.
[profile.ci-release]
inherits = "release"
lto = false

# Core's cryptography is far too slow unoptimised for its tests (thousands of key generations
# and decapsulations), so these crates are optimised in debug builds too.
[profile.dev.package.ml-kem]
opt-level = 3

[profile.dev.package.module-lattice]
opt-level = 3

[profile.dev.package.sha3]
opt-level = 3

[profile.dev.package.shake]
opt-level = 3

[profile.dev.package.keccak]
opt-level = 3

[profile.dev.package.p256]
opt-level = 3

[profile.dev.package.primeorder]
opt-level = 3

[profile.dev.package.primefield]
opt-level = 3

[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.elliptic-curve]
opt-level = 3

[profile.dev.package.aes-gcm]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.ghash]
opt-level = 3

[profile.dev.package.polyval]
opt-level = 3

[profile.dev.package.hkdf]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# The binary (this package) and core are one workspace: the binary's workspaces (src/ws.rs) are
# core's. Naming "." as a member would undo the exclude. The shim keeps its own lock, since the
# agent images build it on its own.
[workspace]
members = ["core"]
exclude = ["box/shim"]
