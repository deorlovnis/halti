[tools]
rust = "stable"

[tasks.check]
description = "Format, lints, all tests that need no human, and a release build's check: run before pushing"
run = "./check.sh"

[tasks.e2e]
description = "End-to-end tests of the built binary (no Touch ID, fake Keychain)"
run = "cargo test --test e2e"

[tasks.e2e-opt-in]
description = "Also the browser (needs npm ci in runner/) and a real Touch ID approval (a human taps)"
run = "cd runner && npm ci --ignore-scripts --no-audit --no-fund --silent && cd .. && HALTI_E2E_BROWSER=1 HALTI_E2E_INTERACTIVE=1 cargo test --test e2e -- --ignored --test-threads=1"

[tasks.e2e-box]
description = "Engine and door end to end: builds the agent and browser images and runs VMs, with Chromium through the door (needs Apple container and the internet)"
env = { HALTI_E2E_BOX = "1" }
run = "cargo test --test box_engine -- --ignored --nocapture && cargo test --bin halti real_vm -- --ignored --nocapture"

[tasks.macos-check]
description = "The check only a Mac can run, with one report, printed and saved: check.sh, the hdiutil and VM tests, the finger steps (see macos-check.sh; takes [--no-vm] [BRANCH])"
run = "./macos-check.sh"
